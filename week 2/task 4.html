<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kim Jisoo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px 50px;
      color: #222;
      background: #f7f7f7;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.3rem;
      margin: 0 0 20px;
      font-weight: 700;
    }

    .profile {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      margin-top: 20px;
    }

    .photo {
      width: 230px;
      height: 230px;
      object-fit: cover;
      border: 1px solid #ddd;
      background: #111;
      display: block;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0;
      max-width: 500px;
    }

    .skills {
      margin-top: 28px;
    }

    h2 {
      font-size: 2rem;
      margin: 0 0 16px;
    }

    ul {
      margin: 0;
      padding-left: 25px;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    a {
      color: #0b5ed7;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .school {
      margin-top: 24px;
      font-size: 1.05rem;
      color: #2d2d2d;
    }

    footer {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kim Jisoo</h1>

    <div class="profile">
      <img
        class="photo"
        src="https://picsum.photos/200/200"
        alt="Kim Jisoo, Computer Science student at Gachon University"
        width="200"
        height="200"
      >

      <p>
        I am a <strong>second-year Computer Science student</strong> at Gachon University,
        passionate about web development and building useful applications.
      </p>
    </div>

    <div class="skills">
      <h2>My Skills</h2>
      <ul>
        <li>HTML — page structure</li>
        <li>Python — data analysis</li>
        <li>Problem-solving</li>
      </ul>
    </div>

    <div class="school">
      <a href="https://www.gachon.ac.kr" target="_blank" rel="noopener noreferrer">
        Gachon University
      </a>
    </div>

    <footer>
      © 2026 Kim Jisoo
    </footer>
  </div>
</body>
</html>
