<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24183e">
  <meta name="description" content="Seven interactive React state and event exercises.">
  <title>Week 11_2 | React State &amp; Events</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24243a;
      background: #f7f6f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #24243a;
      --muted: #68687b;
      --paper: #fff;
      --canvas: #f7f6f2;
      --line: #e7e5df;
      --plum: #24183e;
      --purple: #6e55d9;
      --purple-soft: #f0edff;
      --coral: #ef7a53;
      --lime: #d7f36a;
      --success: #28734e;
      --error: #a63e39;
      --shadow: 0 16px 42px rgb(36 24 62 / 9%);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 92% 18%, rgb(239 122 83 / 10%), transparent 25rem),
        var(--canvas);
      line-height: 1.55;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button,
    a,
    input,
    textarea,
    summary {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    summary:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(100%, 1220px);
      margin: 0 auto;
      padding: 22px clamp(16px, 4vw, 48px) 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--plum);
      font-size: 0.9rem;
      font-weight: 850;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--coral);
      color: #fff;
      font-size: 1.1rem;
    }

    .home-link {
      color: var(--plum);
      font-size: 0.88rem;
      font-weight: 750;
      text-decoration: none;
    }

    .home-link:hover {
      color: var(--purple);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      align-items: center;
      gap: 28px;
      overflow: hidden;
      margin: 28px 0 24px;
      padding: clamp(26px, 5vw, 54px);
      border-radius: 30px;
      background:
        radial-gradient(circle at 84% 18%, rgb(239 122 83 / 22%), transparent 16rem),
        var(--plum);
      color: #fff;
      isolation: isolate;
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      right: -70px;
      bottom: -180px;
      width: 380px;
      height: 380px;
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 50%;
      box-shadow: 0 0 0 34px rgb(255 255 255 / 4%), 0 0 0 72px rgb(255 255 255 / 3%);
      content: "";
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--lime);
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 760px;
      margin-bottom: 14px;
      font-size: clamp(2.4rem, 6vw, 4.65rem);
      font-weight: 850;
      letter-spacing: -0.07em;
      line-height: 1.02;
    }

    .hero-copy {
      max-width: 660px;
      margin: 0;
      color: #e5e1ed;
      font-size: clamp(1rem, 2vw, 1.08rem);
      line-height: 1.7;
    }

    .hero-stat {
      display: grid;
      width: 150px;
      height: 150px;
      align-content: center;
      justify-items: center;
      justify-self: center;
      border: 1px solid rgb(255 255 255 / 25%);
      border-radius: 50%;
      background: rgb(255 255 255 / 7%);
      color: #fff;
      text-align: center;
      transform: rotate(5deg);
    }

    .hero-stat strong {
      color: var(--lime);
      font-size: 2.8rem;
      letter-spacing: -0.07em;
      line-height: 1;
    }

    .hero-stat span {
      margin-top: 8px;
      color: #e5e1ed;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 2px 12px;
    }

    .progress-copy {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 750;
    }

    .progress-track {
      width: min(260px, 45%);
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e6e2ec;
    }

    .progress-fill {
      width: var(--progress, 14.28%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), var(--coral));
      transition: width 180ms ease;
    }

    .exercise-tabs {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 9px;
      overflow-x: auto;
      padding: 3px 2px 13px;
      scrollbar-color: #b7adcf transparent;
      scrollbar-width: thin;
    }

    .step-tab {
      display: grid;
      min-width: 132px;
      min-height: 92px;
      grid-template-columns: 35px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
    }

    .step-tab:hover {
      transform: translateY(-2px);
      border-color: #b7a9f5;
    }

    .step-tab[aria-current="step"] {
      border-color: var(--plum);
      background: var(--plum);
      color: #fff;
    }

    .step-number {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: var(--purple-soft);
      color: var(--plum);
      font-size: 0.73rem;
      font-weight: 850;
    }

    .step-tab[aria-current="step"] .step-number {
      background: var(--coral);
      color: #fff;
    }

    .step-copy {
      min-width: 0;
    }

    .step-title {
      display: block;
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .step-caption {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.69rem;
      line-height: 1.3;
    }

    .step-tab[aria-current="step"] .step-caption {
      color: #d9d4e5;
    }

    .exercise-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .exercise-head {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: clamp(20px, 4vw, 34px);
      border-bottom: 1px solid var(--line);
    }

    .exercise-mark {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border-radius: 18px;
      background: var(--coral);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 900;
    }

    .exercise-label {
      margin: 0 0 4px;
      color: var(--purple);
      font-size: 0.73rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .exercise-head h2 {
      margin: 0;
      color: var(--plum);
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 850;
      letter-spacing: -0.045em;
      line-height: 1.2;
    }

    .goal-pill {
      max-width: 190px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--plum);
      font-size: 0.73rem;
      font-weight: 800;
      text-align: center;
    }

    .exercise-body {
      padding: clamp(20px, 4vw, 34px);
    }

    .hint {
      max-width: 760px;
      margin: 0 0 20px;
      color: var(--muted);
    }

    .demo-panel {
      padding: clamp(18px, 4vw, 30px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #fcfbf9;
    }

    .panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .panel-top h3 {
      margin: 0;
      color: var(--plum);
      font-size: 1rem;
      font-weight: 850;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--purple-soft);
      color: var(--plum);
      font-size: 0.73rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .live-pill::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--coral);
      content: "";
    }

    .counter-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .counter-value {
      color: var(--plum);
      font-size: clamp(4rem, 14vw, 7rem);
      font-weight: 900;
      letter-spacing: -0.09em;
      line-height: 0.95;
    }

    .counter-caption {
      max-width: 230px;
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .button {
      min-height: 44px;
      padding: 10px 17px;
      border: 1px solid var(--plum);
      border-radius: 12px;
      background: var(--plum);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      transition: transform 140ms ease, background-color 140ms ease;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: var(--purple);
    }

    .button.secondary {
      background: #fff;
      color: var(--plum);
    }

    .button.secondary:hover:not(:disabled) {
      background: var(--purple-soft);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .text-input,
    .text-area {
      width: 100%;
      border: 1px solid #d5d2ca;
      border-radius: 13px;
      background: #fff;
      color: var(--ink);
      padding: 12px 14px;
    }

    .text-input {
      min-height: 46px;
    }

    .text-area {
      min-height: 150px;
      resize: vertical;
    }

    .text-input:focus,
    .text-area:focus {
      border-color: var(--purple);
      outline: 3px solid rgb(110 85 217 / 16%);
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--plum);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .preview {
      margin: 17px 0 0;
      padding: 15px 17px;
      border-left: 4px solid var(--coral);
      border-radius: 0 13px 13px 0;
      background: var(--purple-soft);
      color: var(--plum);
      font-size: 1.05rem;
    }

    .list-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
    }

    .item-list,
    .todo-list {
      display: grid;
      gap: 9px;
      margin: 17px 0 0;
      padding: 0;
      list-style: none;
    }

    .list-row,
    .todo-row {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
    }

    .list-row span {
      overflow-wrap: anywhere;
    }

    .empty-state {
      margin: 16px 0 0;
      padding: 16px;
      border-radius: 13px;
      background: var(--purple-soft);
      color: var(--muted);
      text-align: center;
    }

    .icon-button {
      min-height: 38px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--plum);
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .icon-button:hover {
      border-color: var(--coral);
      color: #a9442d;
    }

    .reveal-button {
      min-width: 160px;
    }

    .reveal-content {
      margin-top: 17px;
      padding: 18px;
      border: 1px solid rgb(110 85 217 / 16%);
      border-radius: 16px;
      background: var(--purple-soft);
      color: var(--plum);
      animation: appear 180ms ease-out;
    }

    .reveal-content p:last-child {
      margin-bottom: 0;
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .filter-button {
      min-height: 38px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--plum);
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .filter-button[aria-pressed="true"] {
      border-color: var(--plum);
      background: var(--plum);
      color: #fff;
    }

    .todo-row {
      justify-content: flex-start;
    }

    .todo-row label {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 11px;
      min-width: 0;
      cursor: pointer;
    }

    .todo-row input[type="checkbox"] {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      accent-color: var(--purple);
    }

    .todo-text {
      overflow-wrap: anywhere;
    }

    .todo-row.done .todo-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .form-grid {
      display: grid;
      gap: 15px;
    }

    .field-error,
    .form-message {
      margin: 8px 0 0;
      color: var(--error);
      font-size: 0.84rem;
      font-weight: 750;
    }

    .form-message.success {
      color: var(--success);
    }

    .save-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--plum);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .save-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--coral);
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 13px;
    }

    .example-details {
      margin-top: 20px;
      border-top: 1px solid var(--line);
    }

    .example-details summary {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 16px 0 5px;
      color: var(--plum);
      font-weight: 850;
      cursor: pointer;
      list-style: none;
    }

    .example-details summary::-webkit-details-marker {
      display: none;
    }

    .example-details summary::before {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 8px;
      background: var(--coral);
      color: #fff;
      content: "+";
    }

    .example-details[open] summary::before {
      content: "−";
    }

    .code-wrap {
      overflow: auto;
      margin-top: 12px;
      border-radius: 15px;
      background: #211b2e;
      color: #f7f3ff;
    }

    pre {
      margin: 0;
      padding: 19px;
      font: 0.82rem/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre;
    }

    .step-controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .step-button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--plum);
      font-weight: 800;
      cursor: pointer;
    }

    .step-button:hover:not(:disabled) {
      border-color: var(--coral);
      background: #fff7f3;
    }

    .step-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px 18px;
      margin-top: 28px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.86rem;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: minmax(0, 1fr) 130px;
      }

      .hero-stat {
        width: 122px;
        height: 122px;
      }

      .hero-stat strong {
        font-size: 2.3rem;
      }

      .exercise-tabs {
        grid-template-columns: repeat(7, minmax(145px, 1fr));
      }
    }

    @media (max-width: 560px) {
      .app-shell {
        padding-top: 15px;
      }

      .hero {
        grid-template-columns: 1fr;
        margin-top: 22px;
      }

      .hero-stat {
        width: 82px;
        height: 82px;
        justify-self: start;
      }

      .hero-stat strong {
        font-size: 1.55rem;
      }

      .hero-stat span {
        font-size: 0.6rem;
      }

      .exercise-head {
        grid-template-columns: 46px minmax(0, 1fr);
        gap: 11px;
      }

      .exercise-mark {
        width: 46px;
        height: 46px;
        border-radius: 15px;
      }

      .goal-pill {
        display: none;
      }

      .counter-display {
        align-items: flex-start;
        flex-direction: column;
      }

      .list-form {
        grid-template-columns: 1fr;
      }

      .list-form .button {
        width: 100%;
      }

      .note-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .progress-track {
        width: 38%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <main class="app-shell">
      <a class="home-link" href="../index.html">← Back to portfolio</a>
      <p role="status">Loading React state exercises…</p>
    </main>
  </div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useEffect, useState } = React;

    const exercises = [
      { id: 1, title: "Update state with a counter", short: "Counter", goal: "Functional updates", description: "Use a functional state update so each click uses the latest count." },
      { id: 2, title: "Keep an input in sync", short: "Live input", goal: "Controlled input", description: "Store the input value in state and reflect it immediately in a greeting." },
      { id: 3, title: "Add and remove list items", short: "List updates", goal: "Immutable arrays", description: "Add and remove items without mutating the list, using stable item IDs." },
      { id: 4, title: "Show and hide content", short: "Toggle details", goal: "Boolean state", description: "Use boolean state to reveal content and keep aria-expanded in sync." },
      { id: 5, title: "Complete and filter tasks", short: "Task list", goal: "Filter state", description: "Mark tasks complete, filter by status, and clear completed tasks." },
      { id: 6, title: "Validate a controlled form", short: "Form validation", goal: "Object state", description: "Keep related form fields together and validate them on submit." },
      { id: 7, title: "Save a note in the browser", short: "Saved note", goal: "Effect + storage", description: "Persist a note in localStorage and restore it on your next visit." }
    ];

    const examples = {
      1: `function Counter() {
  const [count, setCount] = useState(0);

  return (
    <>
      <p>{count}</p>
      <button onClick={() => setCount(value => value - 1)}>Decrease</button>
      <button onClick={() => setCount(value => value + 1)}>Add one</button>
      <button onClick={() => setCount(0)}>Reset</button>
    </>
  );
}`,
      2: `function GreetingInput() {
  const [name, setName] = useState("");

  return (
    <>
      <input value={name}
        onChange={event => setName(event.target.value)} />
      <p>Hello, {name.trim() || "there"}!</p>
    </>
  );
}`,
      3: `function ItemList() {
  const [items, setItems] = useState([]);
  const [text, setText] = useState("");

  function addItem(event) {
    event.preventDefault();
    const label = text.trim();
    if (!label) return;
    setItems(current => [...current, { id: crypto.randomUUID(), label }]);
    setText("");
  }

  function removeItem(id) {
    setItems(current => current.filter(item => item.id !== id));
  }

  return (
    <form onSubmit={addItem}>
      <input value={text} onChange={event => setText(event.target.value)} />
      <button>Add</button>
      {items.map(item => (
        <div key={item.id}>
          {item.label}
          <button type="button" onClick={() => removeItem(item.id)}>Remove</button>
        </div>
      ))}
    </form>
  );
}`,
      4: `function DetailsToggle() {
  const [isOpen, setIsOpen] = useState(false);

  return (
    <>
      <button
        aria-expanded={isOpen}
        onClick={() => setIsOpen(open => !open)}
      >
        {isOpen ? "Hide details" : "Show details"}
      </button>
      {isOpen && <p>Extra information is visible.</p>}
    </>
  );
}`,
      5: `function TaskList() {
  const [tasks, setTasks] = useState(initialTasks);
  const [filter, setFilter] = useState("All");

  const visible = tasks.filter(task =>
    filter === "All" || (filter === "Done" ? task.done : !task.done)
  );

  function toggleTask(id) {
    setTasks(current => current.map(task =>
      task.id === id ? { ...task, done: !task.done } : task
    ));
  }

  function clearCompleted() {
    setTasks(current => current.filter(task => !task.done));
  }
}`,
      6: `function ContactForm() {
  const [form, setForm] = useState({ name: "", email: "" });

  function updateField(event) {
    const { name, value } = event.target;
    setForm(current => ({ ...current, [name]: value }));
  }

  function submit(event) {
    event.preventDefault();
    if (!form.name.trim() || !isValidEmail(form.email)) {
      setMessage("Enter your name and a valid email address.");
      return;
    }
    setMessage("Thanks! Your form is valid.");
  }
}`,
      7: `function SavedNote() {
  const [note, setNote] = useState(
    () => localStorage.getItem("week11-2-note") || ""
  );

  useEffect(() => {
    if (note.trim()) localStorage.setItem("week11-2-note", note);
    else localStorage.removeItem("week11-2-note");
  }, [note]);

  return (
    <textarea value={note}
      onChange={event => setNote(event.target.value)} />
  );
}`
    };

    const initialTasks = [
      { id: "read", text: "Read the React lesson", done: true },
      { id: "counter", text: "Try the counter", done: false },
      { id: "list", text: "Update the task list", done: false }
    ];

    function makeItemId() {
      return typeof crypto !== "undefined" && crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function App() {
      const [activeId, setActiveId] = useState(1);
      const [visited, setVisited] = useState([1]);
      const [count, setCount] = useState(0);
      const [name, setName] = useState("");
      const [itemText, setItemText] = useState("");
      const [items, setItems] = useState([]);
      const [listMessage, setListMessage] = useState("");
      const [detailsOpen, setDetailsOpen] = useState(false);
      const [tasks, setTasks] = useState(initialTasks);
      const [taskFilter, setTaskFilter] = useState("All");
      const [form, setForm] = useState({ name: "", email: "" });
      const [formSubmitted, setFormSubmitted] = useState(false);
      const [formMessage, setFormMessage] = useState("");
      const [note, setNote] = useState("");
      const [noteLoaded, setNoteLoaded] = useState(false);
      const [noteStatus, setNoteStatus] = useState("Loading saved note…");

      useEffect(() => {
        let savedNote = null;
        let storageAvailable = true;
        try {
          savedNote = window.localStorage.getItem("week11-2-note");
        } catch {
          storageAvailable = false;
        }
        if (savedNote !== null) setNote(savedNote);
        setNoteStatus(storageAvailable ? (savedNote ? "Saved note restored" : "Nothing saved yet") : "Browser storage is unavailable");
        setNoteLoaded(true);
      }, []);

      useEffect(() => {
        if (!noteLoaded) return;
        try {
          if (note.trim()) {
            window.localStorage.setItem("week11-2-note", note);
            setNoteStatus("Saved in this browser");
          } else {
            window.localStorage.removeItem("week11-2-note");
            setNoteStatus("Nothing saved yet");
          }
        } catch {
          setNoteStatus("Could not save this note; browser storage is unavailable.");
        }
      }, [note, noteLoaded]);

      const activeExercise = exercises.find(exercise => exercise.id === activeId);
      const filteredTasks = tasks.filter(task =>
        taskFilter === "All" || (taskFilter === "Done" ? task.done : !task.done)
      );
      const completedCount = tasks.filter(task => task.done).length;
      const progress = Math.round((visited.length / exercises.length) * 100);

      function selectExercise(id) {
        setActiveId(id);
        setVisited(current => current.includes(id) ? current : [...current, id]);
      }

      function addItem(event) {
        event.preventDefault();
        const label = itemText.trim();
        if (!label) {
          setListMessage("Type an item before adding it.");
          return;
        }
        setItems(current => [...current, { id: makeItemId(), label }]);
        setItemText("");
        setListMessage("");
      }

      function updateForm(event) {
        const { name: fieldName, value } = event.target;
        setForm(current => ({ ...current, [fieldName]: value }));
        setFormMessage("");
      }

      function submitForm(event) {
        event.preventDefault();
        setFormSubmitted(true);
        const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim());
        if (!form.name.trim() || !validEmail) {
          setFormMessage("Please enter your name and a valid email address.");
          return;
        }
        setFormMessage(`Thanks, ${form.name.trim()}! Your form is valid.`);
      }

      function renderExercise() {
        switch (activeId) {
          case 1:
            return <div className="demo-panel">
              <div className="panel-top"><h3>Counter playground</h3><span className="live-pill">State updates live</span></div>
              <div className="counter-display">
                <output className="counter-value" aria-live="polite">{count}</output>
                <p className="counter-caption">Each button uses the latest value, even across quick clicks.</p>
              </div>
              <div className="button-row">
                <button className="button secondary" onClick={() => setCount(value => value - 1)}>Decrease</button>
                <button className="button" onClick={() => setCount(value => value + 1)}>Add one</button>
                <button className="button secondary" onClick={() => setCount(0)}>Reset</button>
              </div>
            </div>;
          case 2:
            return <div className="demo-panel">
              <div className="panel-top"><h3>Your greeting</h3><span className="live-pill">Controlled input</span></div>
              <label className="field-label" htmlFor="greeting-name">Your name</label>
              <input className="text-input" id="greeting-name" value={name} onChange={event => setName(event.target.value)} placeholder="Type a name" />
              <p className="preview" aria-live="polite">Hello, <strong>{name.trim() || "there"}</strong>!</p>
            </div>;
          case 3:
            return <div className="demo-panel">
              <div className="panel-top">
                <h3>My practice list</h3>
                <span className="live-pill">{items.length} {items.length === 1 ? "item" : "items"}</span>
              </div>
              <form className="list-form" onSubmit={addItem}>
                <input className="text-input" value={itemText} onChange={event => { setItemText(event.target.value); setListMessage(""); }} placeholder="Add a practice task" aria-label="New list item" />
                <button className="button" type="submit">Add item</button>
              </form>
              {listMessage && <p className="field-error" role="status">{listMessage}</p>}
              {items.length
                ? <ul className="item-list">{items.map(item => <li className="list-row" key={item.id}><span>{item.label}</span><button className="icon-button" type="button" onClick={() => setItems(current => current.filter(entry => entry.id !== item.id))} aria-label={`Remove ${item.label}`}>Remove</button></li>)}</ul>
                : <p className="empty-state">Your list is empty. Add your first practice task above.</p>}
            </div>;
          case 4:
            return <div className="demo-panel">
              <div className="panel-top"><h3>Extra information</h3><span className="live-pill">Accessible toggle</span></div>
              <button className="button reveal-button" aria-expanded={detailsOpen} aria-controls="extra-details" onClick={() => setDetailsOpen(open => !open)}>{detailsOpen ? "Hide details" : "Show details"}</button>
              <div id="extra-details" hidden={!detailsOpen} className="reveal-content">
                <h3>Why this matters</h3>
                <p>This section follows a boolean state value. The button exposes its current state with <code>aria-expanded</code>, so assistive technology can tell whether the details are open.</p>
              </div>
            </div>;
          case 5:
            return <div className="demo-panel">
              <div className="panel-top"><h3>Today’s tasks</h3><span className="live-pill">{completedCount} of {tasks.length} done</span></div>
              <div className="filter-tabs" role="group" aria-label="Filter tasks">
                {["All", "Active", "Done"].map(filter => <button key={filter} className="filter-button" aria-pressed={taskFilter === filter} onClick={() => setTaskFilter(filter)}>{filter}</button>)}
              </div>
              {filteredTasks.length
                ? <ul className="todo-list">{filteredTasks.map(task => <li className={`todo-row${task.done ? " done" : ""}`} key={task.id}><label><input type="checkbox" checked={task.done} onChange={() => setTasks(current => current.map(item => item.id === task.id ? { ...item, done: !item.done } : item))} /><span className="todo-text">{task.text}</span></label></li>)}</ul>
                : <p className="empty-state">No tasks in this view. Try another filter.</p>}
              <div className="button-row" style={{ marginTop: 16 }}>
                <button className="button secondary" onClick={() => setTasks(current => current.filter(task => !task.done))} disabled={!completedCount}>Clear completed</button>
              </div>
            </div>;
          case 6: {
            const nameInvalid = formSubmitted && !form.name.trim();
            const emailInvalid = formSubmitted && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim());
            return <div className="demo-panel">
              <div className="panel-top"><h3>Contact details</h3><span className="live-pill">One form state object</span></div>
              <form className="form-grid" onSubmit={submitForm} noValidate>
                <div>
                  <label className="field-label" htmlFor="contact-name">Name</label>
                  <input className="text-input" id="contact-name" name="name" value={form.name} onChange={updateForm} placeholder="Your name" autoComplete="name" aria-invalid={nameInvalid || undefined} aria-describedby={nameInvalid ? "name-error" : undefined} />
                  {nameInvalid && <p className="field-error" id="name-error">Enter your name.</p>}
                </div>
                <div>
                  <label className="field-label" htmlFor="contact-email">Email</label>
                  <input className="text-input" id="contact-email" name="email" type="email" value={form.email} onChange={updateForm} placeholder="you@example.com" autoComplete="email" aria-invalid={emailInvalid || undefined} aria-describedby={emailInvalid ? "email-error" : undefined} />
                  {emailInvalid && <p className="field-error" id="email-error">Enter a valid email address.</p>}
                </div>
                <div className="button-row"><button className="button" type="submit">Check and submit</button></div>
              </form>
              {formMessage && <p className={`form-message${formSubmitted && !nameInvalid && !emailInvalid ? " success" : ""}`} role="status">{formMessage}</p>}
            </div>;
          }
          case 7:
            return <div className="demo-panel">
              <div className="panel-top"><h3>Quick note</h3><span className="live-pill">Autosave demo</span></div>
              <label className="field-label" htmlFor="saved-note">Your note</label>
              <textarea className="text-area" id="saved-note" value={note} onChange={event => setNote(event.target.value)} placeholder="Write a thought to keep for later…" />
              <div className="note-footer">
                <span className="save-status" role="status"><span className="save-dot" />{noteStatus}</span>
                <button className="button secondary" onClick={() => setNote("")} disabled={!note}>Clear note</button>
              </div>
            </div>;
          default:
            return null;
        }
      }

      return <main className="app-shell">
        <div className="topbar">
          <a className="brand" href="../index.html"><span className="brand-mark" aria-hidden="true">↗</span><span>Aung Sett Khine · Coursework</span></a>
          <a className="home-link" href="../index.html">Portfolio home ↑</a>
        </div>

        <header className="hero">
          <div>
            <p className="eyebrow">Week 11_2 · React state &amp; events</p>
            <h1>Make the interface respond.</h1>
            <p className="hero-copy">Practice updating the screen from user input with React state and event handlers. Pick an exercise, try it out, and open the code example when you’re ready.</p>
          </div>
          <div className="hero-stat" aria-label="Seven interactive exercises"><strong>07</strong><span>hands-on labs</span></div>
        </header>

        <div className="progress-row">
          <p className="progress-copy" aria-live="polite">{visited.length} of 7 exercises explored</p>
          <div className="progress-track" role="progressbar" aria-label="Exercises explored" aria-valuemin="0" aria-valuemax="7" aria-valuenow={visited.length}>
            <div className="progress-fill" style={{ "--progress": `${progress}%` }} />
          </div>
        </div>

        <nav className="exercise-tabs" aria-label="Choose a React state exercise">
          {exercises.map((exercise, index) => <button key={exercise.id} className="step-tab" aria-current={activeId === exercise.id ? "step" : undefined} onClick={() => selectExercise(exercise.id)}>
            <span className="step-number">{String(index + 1).padStart(2, "0")}</span>
            <span className="step-copy"><span className="step-title">{exercise.short}</span><span className="step-caption">{exercise.goal}</span></span>
          </button>)}
        </nav>

        <section className="exercise-panel" aria-live="polite" aria-labelledby="active-exercise-title">
          <div className="exercise-head">
            <span className="exercise-mark">E{activeExercise.id}</span>
            <div>
              <p className="exercise-label">React state &amp; events · Exercise {activeExercise.id} of 7</p>
              <h2 id="active-exercise-title">{activeExercise.title}</h2>
            </div>
            <span className="goal-pill">{activeExercise.goal}</span>
          </div>
          <div className="exercise-body">
            <p className="hint">{activeExercise.description}</p>
            {renderExercise()}
            <details className="example-details">
              <summary>View React example</summary>
              <div className="code-wrap"><pre><code>{examples[activeId]}</code></pre></div>
            </details>
            <div className="step-controls">
              <button className="step-button" disabled={activeId === 1} onClick={() => selectExercise(activeId - 1)}>← Previous</button>
              <button className="step-button" disabled={activeId === 7} onClick={() => selectExercise(activeId + 1)}>Next exercise →</button>
            </div>
          </div>
        </section>

        <footer>
          <span>Week 11_2 · React State &amp; Events</span>
          <a className="home-link" href="../index.html">Back to the course portfolio</a>
        </footer>
      </main>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
