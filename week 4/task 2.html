<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aung Sett Khine - Profile Card</title>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 24px;
      background: #f0f4ff;
      font-family: system-ui, sans-serif;
    }

    .card {
      width: min(260px, 100%);
      padding: 24px;
      border: 2px solid #c8d4f0;
      border-radius: 16px;
      background: #f0f4ff;
      text-align: center;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .card.dark {
      background: #1a2340;
      border-color: #3a4a70;
      color: white;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #1a56db;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
    }

    #toggle-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      margin-top: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #toggle-btn:focus-visible {
      outline: 3px solid #1a56db;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main id="card" class="card">
    <div class="avatar" aria-hidden="true">👩‍💻</div>
    <h1>AUNG SETT KHINE</h1>
    <p>Web Programming Student</p>
    <button id="toggle-btn" type="button">🌙 Dark Mode</button>
  </main>

  <script>
    const card = document.querySelector('#card');
    const btn = document.querySelector('#toggle-btn');

    btn.addEventListener('click', () => {
      card.classList.toggle('dark');
      if (card.classList.contains('dark')) {
        btn.textContent = '☀️ Light Mode';
      } else {
        btn.textContent = '🌙 Dark Mode';
      }
    });
  </script>
</body>
</html>
