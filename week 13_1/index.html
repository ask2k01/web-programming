<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17172b">
  <meta name="description" content="Week 13_1 interactive React forms lessons with controlled fields, validation, and checkboxes.">
  <title>Week 13_1 | React Forms Lab</title>
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24243a;
      background: #f7f6f2;
      --ink: #24243a;
      --muted: #656679;
      --paper: #fff;
      --canvas: #f7f6f2;
      --line: #e4e2eb;
      --purple: #6e55d9;
      --purple-dark: #4c35b3;
      --purple-soft: #f0edff;
      --lime: #d7f36a;
      --dark: #17172b;
      --orange: #e87b50;
      --red: #a63c3c;
      --green: #18764d;
      --shadow: 0 12px 30px rgb(36 36 58 / 6%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 92% 6%, rgb(215 243 106 / 18%), transparent 25rem),
        var(--canvas);
      line-height: 1.55;
    }

    a, button, input, textarea { font: inherit; }
    a { color: var(--purple-dark); }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 3px;
    }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 22px clamp(16px, 4vw, 48px) 52px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--dark);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: var(--lime);
      color: var(--dark);
    }

    .nav-links { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .nav-links a { font-size: 0.88rem; font-weight: 800; text-decoration: none; }
    .nav-links a:hover { text-decoration: underline; text-underline-offset: 4px; }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      align-items: center;
      gap: 22px;
      overflow: hidden;
      margin-bottom: 22px;
      padding: clamp(26px, 5vw, 46px);
      border-radius: 26px;
      background:
        radial-gradient(circle at 88% 12%, rgb(110 85 217 / 42%), transparent 17rem),
        var(--dark);
      color: #fff;
      isolation: isolate;
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      right: -80px;
      bottom: -180px;
      width: 340px;
      height: 340px;
      border: 1px solid rgb(215 243 106 / 28%);
      border-radius: 50%;
      box-shadow: 0 0 0 34px rgb(215 243 106 / 5%), 0 0 0 70px rgb(215 243 106 / 3%);
      content: "";
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--lime);
      font-size: 0.73rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(2.35rem, 6vw, 4.4rem);
      letter-spacing: -0.075em;
      line-height: 1.03;
    }

    .hero-copy { max-width: 650px; margin: 15px 0 0; color: #e5e2f0; }

    .hero-stat {
      display: grid;
      width: 128px;
      height: 128px;
      place-items: center;
      align-content: center;
      justify-self: center;
      border: 1px solid rgb(255 255 255 / 27%);
      border-radius: 50%;
      background: rgb(255 255 255 / 6%);
      text-align: center;
      transform: rotate(6deg);
    }

    .hero-stat strong { color: var(--lime); font-size: 2.2rem; line-height: 1; }
    .hero-stat span {
      max-width: 95px;
      margin-top: 8px;
      color: #e5e2f0;
      font-size: 0.65rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .intro-note {
      margin: 0 0 18px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--paper);
      color: var(--muted);
      font-size: 0.87rem;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 16px;
    }

    .demo-card, .cheat-sheet {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .contact-card { grid-column: 1 / -1; }

    .card-heading {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .number {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      background: var(--purple-soft);
      color: var(--purple-dark);
      font-size: 0.82rem;
      font-weight: 900;
    }

    h2 { margin: 1px 0 0; color: var(--ink); font-size: 1.12rem; letter-spacing: -0.025em; }
    .card-description { margin: 0 0 14px; color: var(--muted); font-size: 0.88rem; }

    .demo {
      padding: 15px;
      border: 1px solid #ded9f7;
      border-radius: 13px;
      background: #faf9ff;
    }

    .field-label { display: block; margin: 0 0 5px; color: var(--ink); font-size: 0.84rem; font-weight: 800; }
    .field { width: 100%; }

    .text-input, textarea {
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #cbc7d8;
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
    }

    textarea { min-height: 108px; resize: vertical; }
    textarea:disabled { background: #efedf4; color: var(--muted); cursor: not-allowed; }

    .form-stack { display: grid; gap: 12px; }
    .field-error { margin: 4px 0 0; color: var(--red); font-size: 0.79rem; font-weight: 750; }
    .char-count { margin: 7px 0 0; font-size: 0.8rem; text-align: right; }
    .char-count.normal { color: var(--muted); }
    .char-count.warning { color: var(--red); font-weight: 850; }
    .helper { margin: 8px 0 0; color: var(--muted); font-size: 0.78rem; }

    .button {
      min-height: 40px;
      padding: 8px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--purple-dark);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 850;
      cursor: pointer;
    }

    .button:hover { background: var(--purple); }
    .button.secondary { border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
    .button.secondary:hover { border-color: var(--purple); }
    .button:disabled { cursor: not-allowed; opacity: 0.55; }
    .button-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }

    .checkbox-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .skill-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      font-size: 0.86rem;
      cursor: pointer;
    }

    .skill-option input { accent-color: var(--purple-dark); }
    .counter { margin: 0; color: var(--ink); font-weight: 850; }
    .warning { margin: 6px 0 0; color: var(--red); font-size: 0.82rem; font-weight: 800; }

    .success-panel {
      padding: 18px;
      border: 1px solid #b9dfc9;
      border-radius: 12px;
      background: #f0faf4;
      color: #205a3a;
    }

    .success-panel h3 { margin: 0 0 5px; }
    .success-panel p { margin: 0 0 12px; }

    .homework-section {
      margin-top: 20px;
      padding: clamp(18px, 3vw, 26px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .homework-heading { margin-bottom: 16px; }
    .homework-heading h2 { font-size: 1.45rem; }
    .homework-heading p { max-width: 720px; margin: 7px 0 0; color: var(--muted); font-size: 0.88rem; }
    .profile-editor-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(270px, 0.85fr);
      align-items: start;
      gap: 18px;
    }

    .profile-form {
      display: grid;
      gap: 13px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fcfbff;
    }

    .profile-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .profile-field-wide { grid-column: 1 / -1; }
    .profile-fields select { appearance: auto; }
    .required-mark { color: var(--red); }
    .radio-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .radio-option {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      font-size: 0.83rem;
      cursor: pointer;
    }

    .radio-option input { accent-color: var(--purple-dark); }
    .photo-preview-row { display: flex; align-items: center; gap: 11px; margin-top: 9px; }
    .photo-thumbnail {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 13px;
      object-fit: cover;
    }

    .photo-name { margin: 0; overflow-wrap: anywhere; color: var(--muted); font-size: 0.78rem; }
    .skill-entry { display: flex; gap: 8px; }
    .skill-entry .text-input { flex: 1; min-width: 0; }
    .profile-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .profile-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px 5px 10px;
      border-radius: 999px;
      background: var(--purple-soft);
      color: var(--purple-dark);
      font-size: 0.79rem;
      font-weight: 800;
    }

    .tag-remove {
      display: inline-grid;
      width: 20px;
      height: 20px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgb(76 53 179 / 12%);
      color: var(--purple-dark);
      font-weight: 900;
      cursor: pointer;
    }

    .tag-remove:hover { background: rgb(76 53 179 / 23%); }
    .profile-preview-shell { padding: 16px; border-radius: 16px; background: var(--dark); }
    .profile-preview-label {
      margin: 0 0 10px;
      color: #aab8dc;
      font-size: 0.73rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .student-preview {
      display: flex;
      flex-direction: column;
      min-height: 290px;
      padding: 18px;
      border-radius: 13px;
      background: var(--paper);
    }

    .student-preview.empty { display: grid; place-items: center; text-align: center; }
    .preview-empty-mark, .student-avatar {
      display: grid;
      width: 74px;
      height: 74px;
      flex: 0 0 74px;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: #315f8a;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .preview-empty-mark { margin: 0 auto 13px; opacity: 0.78; }
    .preview-empty-copy { max-width: 210px; margin: 0 auto; color: var(--muted); font-size: 0.84rem; }
    .student-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .student-preview-top { display: flex; align-items: flex-start; gap: 13px; }
    .student-preview-name { margin: 7px 0 2px; color: var(--ink); font-size: 1.15rem; line-height: 1.25; }
    .student-preview-meta { margin: 0; color: var(--muted); font-size: 0.84rem; }
    .student-preview-major { margin: 2px 0 0; color: #087c86; font-size: 0.84rem; font-weight: 850; }
    .student-preview-bio { margin: 16px 0 0; color: #45516a; font-size: 0.86rem; overflow-wrap: anywhere; white-space: pre-wrap; }
    .student-preview-skills { margin-top: auto; padding-top: 18px; }
    .student-preview-skills .profile-tags { margin-top: 0; }
    .student-preview-skills .profile-tag { background: #eef7f1; color: #18764d; }

    .code-details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    .code-details summary { width: fit-content; color: var(--purple-dark); font-size: 0.8rem; font-weight: 850; cursor: pointer; }

    pre {
      max-width: 100%;
      margin: 9px 0 0;
      padding: 12px;
      overflow: auto;
      border-radius: 10px;
      background: var(--dark);
      color: #fff;
      font-size: 0.76rem;
      line-height: 1.55;
      tab-size: 2;
      white-space: pre;
    }

    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    .cheat-sheet { margin-top: 18px; }
    .cheat-sheet > p { margin: 6px 0 16px; color: var(--muted); font-size: 0.88rem; }
    .cheat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }

    .cheat-card {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--canvas);
    }

    .cheat-card h3 { margin: 0 0 8px; color: var(--purple-dark); font-size: 0.85rem; }
    .cheat-card pre { margin: 0; padding: 10px; font-size: 0.7rem; }

    footer { margin-top: 24px; padding-top: 15px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; }

    @media (max-width: 850px) {
      .cheat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .hero { grid-template-columns: 1fr; border-radius: 20px; }
      .hero-stat { width: 82px; height: 82px; justify-self: start; transform: none; }
      .hero-stat strong { font-size: 1.5rem; }
      .hero-stat span { font-size: 0.54rem; }
      .demo-grid { grid-template-columns: 1fr; }
      .contact-card { grid-column: auto; }
      .demo-card, .cheat-sheet { padding: 16px; }
      .profile-editor-layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 420px) {
      .page { padding-inline: 14px; }
      .checkbox-list, .cheat-grid { grid-template-columns: 1fr; }
      .profile-fields { grid-template-columns: 1fr; }
      .profile-field-wide { grid-column: auto; }
      .skill-entry { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="forms-root"></div>
  <script type="text/babel">
    const { useEffect, useState } = React;
    const MAX_BIO_LENGTH = 200;
    const SKILLS = ["HTML", "CSS", "JavaScript", "React", "Node.js", "Python"];

    function DemoCard({ number, title, description, snippet, className = "", children }) {
      return (
        <section className={`demo-card ${className}`} aria-labelledby={`demo-title-${number}`}>
          <div className="card-heading">
            <span className="number" aria-hidden="true">{number}</span>
            <h2 id={`demo-title-${number}`}>{title}</h2>
          </div>
          <p className="card-description">{description}</p>
          <div className="demo">{children}</div>
          <details className="code-details">
            <summary>Show React pattern</summary>
            <pre><code>{snippet}</code></pre>
          </details>
        </section>
      );
    }

    function BioField() {
      const [bio, setBio] = useState("");
      const remaining = MAX_BIO_LENGTH - bio.length;
      const limitReached = bio.length >= MAX_BIO_LENGTH;

      return (
        <div>
          <label className="field-label" htmlFor="bio">Your bio</label>
          <textarea
            id="bio"
            value={bio}
            onChange={event => setBio(event.target.value.slice(0, MAX_BIO_LENGTH))}
            rows={4}
            maxLength={MAX_BIO_LENGTH}
            disabled={limitReached}
            placeholder="Your bio"
            aria-describedby="bio-count bio-help"
          />
          <p className={`char-count ${remaining < 20 ? "warning" : "normal"}`} id="bio-count" aria-live="polite">
            {bio.length} / {MAX_BIO_LENGTH}
          </p>
          <p className="helper" id="bio-help">
            {limitReached ? "Character limit reached. Clear your bio to edit it again." : "The textarea disables at 200 characters."}
          </p>
          {limitReached && (
            <div className="button-row">
              <button className="button secondary" type="button" onClick={() => setBio("")}>Clear bio</button>
            </div>
          )}
        </div>
      );
    }

    const EMPTY_FORM = { name: "", email: "", message: "" };

    function ContactForm() {
      const [form, setForm] = useState(EMPTY_FORM);
      const [errors, setErrors] = useState({});
      const [submittedName, setSubmittedName] = useState("");
      const [submitted, setSubmitted] = useState(false);

      function handleChange(event) {
        const { name, value } = event.target;
        setForm(previous => ({ ...previous, [name]: value }));
        setErrors(previous => ({ ...previous, [name]: "" }));
      }

      function handleSubmit(event) {
        event.preventDefault();
        const validationErrors = {};
        if (!form.name.trim()) validationErrors.name = "Name is required.";
        if (!form.email.trim()) {
          validationErrors.email = "Email is required.";
        } else if (!event.currentTarget.elements.namedItem("email").validity.valid) {
          validationErrors.email = "Enter a valid email address.";
        }
        if (!form.message.trim()) validationErrors.message = "Message is required.";

        setErrors(validationErrors);
        if (Object.keys(validationErrors).length > 0) return;

        setSubmittedName(form.name.trim());
        setForm(EMPTY_FORM);
        setErrors({});
        setSubmitted(true);
      }

      if (submitted) {
        return (
          <div className="success-panel" role="status" aria-live="polite">
            <h3>Thank you, {submittedName}!</h3>
            <p>We’ll be in touch.</p>
            <button className="button" type="button" onClick={() => setSubmitted(false)}>Send another message</button>
          </div>
        );
      }

      return (
        <form className="form-stack" onSubmit={handleSubmit} noValidate>
          <div className="field">
            <label className="field-label" htmlFor="contact-name">Name</label>
            <input
              className="text-input"
              id="contact-name"
              name="name"
              value={form.name}
              onChange={handleChange}
              aria-invalid={Boolean(errors.name)}
              aria-describedby={errors.name ? "error-name" : undefined}
            />
            {errors.name && <p className="field-error" id="error-name" role="alert">{errors.name}</p>}
          </div>
          <div className="field">
            <label className="field-label" htmlFor="contact-email">Email</label>
            <input
              className="text-input"
              id="contact-email"
              name="email"
              type="email"
              value={form.email}
              onChange={handleChange}
              aria-invalid={Boolean(errors.email)}
              aria-describedby={errors.email ? "error-email" : undefined}
            />
            {errors.email && <p className="field-error" id="error-email" role="alert">{errors.email}</p>}
          </div>
          <div className="field">
            <label className="field-label" htmlFor="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              value={form.message}
              onChange={handleChange}
              rows={4}
              aria-invalid={Boolean(errors.message)}
              aria-describedby={errors.message ? "error-message" : undefined}
            />
            {errors.message && <p className="field-error" id="error-message" role="alert">{errors.message}</p>}
          </div>
          <div className="button-row">
            <button className="button" type="submit">Send message</button>
          </div>
        </form>
      );
    }

    function SkillPicker() {
      const [selected, setSelected] = useState([]);

      function toggle(skill, checked) {
        setSelected(previous => checked
          ? previous.includes(skill) ? previous : [...previous, skill]
          : previous.filter(item => item !== skill)
        );
      }

      return (
        <fieldset style={{ border: 0, margin: 0, padding: 0 }}>
          <legend className="field-label">Choose programming skills</legend>
          <p className="counter" aria-live="polite">Selected: {selected.length} / 3</p>
          {selected.length > 3 && (
            <p className="warning" role="alert">Please select at most 3 skills.</p>
          )}
          <div className="checkbox-list">
            {SKILLS.map(skill => (
              <label className="skill-option" key={skill}>
                <input
                  type="checkbox"
                  checked={selected.includes(skill)}
                  onChange={event => toggle(skill, event.target.checked)}
                />
                {skill}
              </label>
            ))}
          </div>
        </fieldset>
      );
    }

    const EMPTY_PROFILE = {
      name: "",
      studentId: "",
      major: "",
      year: "",
      bio: "",
      photo: null
    };

    function StudentProfileEditor() {
      const [profile, setProfile] = useState(EMPTY_PROFILE);
      const [errors, setErrors] = useState({});
      const [photoPreview, setPhotoPreview] = useState("");
      const [skillInput, setSkillInput] = useState("");
      const [skills, setSkills] = useState([]);
      const [submitted, setSubmitted] = useState(false);

      useEffect(() => {
        if (!profile.photo || !profile.photo.type.startsWith("image/")) {
          setPhotoPreview("");
          return undefined;
        }

        const previewUrl = URL.createObjectURL(profile.photo);
        setPhotoPreview(previewUrl);
        return () => URL.revokeObjectURL(previewUrl);
      }, [profile.photo]);

      function handleChange(event) {
        const { name, value } = event.target;
        const nextValue = name === "photo"
          ? (event.target.files ? event.target.files[0] : null)
          : value;

        setProfile(previous => ({ ...previous, [name]: nextValue }));
        setErrors(previous => ({ ...previous, [name]: "" }));
        setSubmitted(false);
      }

      function addSkill() {
        const skill = skillInput.trim();
        if (!skill) return;

        if (!skills.some(existing => existing.toLowerCase() === skill.toLowerCase())) {
          setSkills(previous => [...previous, skill]);
        }
        setSkillInput("");
        setSubmitted(false);
      }

      function handleSkillKeyDown(event) {
        if (event.key === "Enter") {
          event.preventDefault();
          addSkill();
        }
      }

      function removeSkill(skillToRemove) {
        setSkills(previous => previous.filter(skill => skill !== skillToRemove));
        setSubmitted(false);
      }

      function handleSubmit(event) {
        event.preventDefault();
        const nextErrors = {};

        if (!profile.name.trim()) nextErrors.name = "Name is required.";
        if (!/^\d{10}$/.test(profile.studentId)) {
          nextErrors.studentId = "Student ID must contain exactly 10 digits.";
        }
        if (!profile.major) nextErrors.major = "Choose a major.";
        if (!profile.year) nextErrors.year = "Choose your year.";
        if (!profile.bio.trim()) {
          nextErrors.bio = "Bio is required.";
        } else if (profile.bio.length >= 200) {
          nextErrors.bio = "Bio must be fewer than 200 characters.";
        }
        if (!profile.photo) {
          nextErrors.photo = "Choose a profile photo.";
        } else if (!profile.photo.type.startsWith("image/")) {
          nextErrors.photo = "Choose an image file.";
        }

        setErrors(nextErrors);
        if (Object.keys(nextErrors).length > 0) {
          setSubmitted(false);
          return;
        }

        setSubmitted(true);
      }

      const initials = profile.name.trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part.charAt(0))
        .join("")
        .toUpperCase();

      return (
        <section className="homework-section" aria-labelledby="profile-homework-title">
          <div className="homework-heading">
            <p className="eyebrow" style={{ color: "var(--purple-dark)", marginBottom: 6 }}>Applied homework</p>
            <h2 id="profile-homework-title">Student Profile Editor</h2>
            <p>Complete every field, validate the student details, and create a profile preview. Add skills as tags for the stretch goal.</p>
          </div>

          <div className="profile-editor-layout">
            <form className="profile-form" onSubmit={handleSubmit} noValidate>
              <div className="profile-fields">
                <div className="field">
                  <label className="field-label" htmlFor="profile-name">Full name <span className="required-mark" aria-hidden="true">*</span></label>
                  <input
                    className="text-input"
                    id="profile-name"
                    name="name"
                    value={profile.name}
                    onChange={handleChange}
                    required
                    aria-invalid={Boolean(errors.name)}
                    aria-describedby={errors.name ? "profile-error-name" : undefined}
                  />
                  {errors.name && <p className="field-error" id="profile-error-name" role="alert">{errors.name}</p>}
                </div>

                <div className="field">
                  <label className="field-label" htmlFor="profile-student-id">Student ID <span className="required-mark" aria-hidden="true">*</span></label>
                  <input
                    className="text-input"
                    id="profile-student-id"
                    name="studentId"
                    value={profile.studentId}
                    onChange={handleChange}
                    inputMode="numeric"
                    maxLength={10}
                    required
                    aria-invalid={Boolean(errors.studentId)}
                    aria-describedby={errors.studentId ? "profile-error-student-id" : "student-id-help"}
                  />
                  <p className="helper" id="student-id-help">Enter exactly 10 digits.</p>
                  {errors.studentId && <p className="field-error" id="profile-error-student-id" role="alert">{errors.studentId}</p>}
                </div>

                <div className="field">
                  <label className="field-label" htmlFor="profile-major">Major <span className="required-mark" aria-hidden="true">*</span></label>
                  <select
                    className="text-input"
                    id="profile-major"
                    name="major"
                    value={profile.major}
                    onChange={handleChange}
                    required
                    aria-invalid={Boolean(errors.major)}
                    aria-describedby={errors.major ? "profile-error-major" : undefined}
                  >
                    <option value="">Select a major</option>
                    <option value="Computer Engineering">Computer Engineering</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Cybersecurity">Cybersecurity</option>
                  </select>
                  {errors.major && <p className="field-error" id="profile-error-major" role="alert">{errors.major}</p>}
                </div>

                <fieldset
                  className="field profile-field-wide"
                  style={{ border: 0, margin: 0, padding: 0 }}
                  aria-describedby={errors.year ? "profile-error-year" : undefined}
                >
                  <legend className="field-label">Year <span className="required-mark" aria-hidden="true">*</span></legend>
                  <div className="radio-list">
                    {[1, 2, 3, 4].map(year => (
                      <label className="radio-option" key={year}>
                        <input
                          type="radio"
                          name="year"
                          value={String(year)}
                          checked={profile.year === String(year)}
                          onChange={handleChange}
                        />
                        Year {year}
                      </label>
                    ))}
                  </div>
                  {errors.year && <p className="field-error" id="profile-error-year" role="alert">{errors.year}</p>}
                </fieldset>

                <div className="field profile-field-wide">
                  <label className="field-label" htmlFor="profile-bio">Bio <span className="required-mark" aria-hidden="true">*</span></label>
                  <textarea
                    id="profile-bio"
                    name="bio"
                    value={profile.bio}
                    onChange={handleChange}
                    rows={4}
                    maxLength={199}
                    required
                    aria-invalid={Boolean(errors.bio)}
                    aria-describedby={errors.bio ? "profile-error-bio profile-bio-count" : "profile-bio-count"}
                  />
                  <p className={`char-count ${profile.bio.length > 180 ? "warning" : "normal"}`} id="profile-bio-count" aria-live="polite">
                    {profile.bio.length} / 200
                  </p>
                  {errors.bio && <p className="field-error" id="profile-error-bio" role="alert">{errors.bio}</p>}
                </div>

                <div className="field profile-field-wide">
                  <label className="field-label" htmlFor="profile-photo">Photo <span className="required-mark" aria-hidden="true">*</span></label>
                  <input
                    className="text-input"
                    id="profile-photo"
                    name="photo"
                    type="file"
                    accept="image/*"
                    required
                    onChange={handleChange}
                    aria-invalid={Boolean(errors.photo)}
                    aria-describedby={errors.photo ? "profile-error-photo" : "profile-photo-help"}
                  />
                  <p className="helper" id="profile-photo-help">Choose an image file. It will be previewed here before submission.</p>
                  {errors.photo && <p className="field-error" id="profile-error-photo" role="alert">{errors.photo}</p>}
                  {photoPreview && (
                    <div className="photo-preview-row">
                      <img className="photo-thumbnail" src={photoPreview} alt="Selected profile preview" />
                      <p className="photo-name">{profile.photo.name}</p>
                    </div>
                  )}
                </div>
              </div>

              <div className="field">
                <label className="field-label" htmlFor="profile-skill">Skills <span style={{ color: "var(--muted)", fontWeight: 500 }}>(stretch goal)</span></label>
                <div className="skill-entry">
                  <input
                    className="text-input"
                    id="profile-skill"
                    value={skillInput}
                    onChange={event => setSkillInput(event.target.value)}
                    onKeyDown={handleSkillKeyDown}
                    placeholder="Type a skill and press Enter"
                  />
                  <button className="button secondary" type="button" onClick={addSkill}>Add skill</button>
                </div>
                {skills.length > 0 && (
                  <div className="profile-tags" aria-label="Added skills">
                    {skills.map(skill => (
                      <span className="profile-tag" key={skill}>
                        {skill}
                        <button
                          className="tag-remove"
                          type="button"
                          aria-label={`Remove ${skill}`}
                          onClick={() => removeSkill(skill)}
                        >
                          ×
                        </button>
                      </span>
                    ))}
                  </div>
                )}
              </div>

              <div className="button-row">
                <button className="button" type="submit">Create profile preview</button>
              </div>
              {submitted && <p className="counter" role="status">Profile preview created successfully.</p>}
            </form>

            <aside className="profile-preview-shell" aria-label="Student profile preview">
              <p className="profile-preview-label">Profile preview</p>
              {submitted ? (
                <article className="student-preview">
                  <div className="student-preview-top">
                    <div className="student-avatar">
                      <img src={photoPreview} alt={`${profile.name}'s profile`} />
                    </div>
                    <div>
                      <h3 className="student-preview-name">{profile.name.trim()}</h3>
                      <p className="student-preview-meta">ID {profile.studentId} · Year {profile.year}</p>
                      <p className="student-preview-major">{profile.major}</p>
                    </div>
                  </div>
                  <p className="student-preview-bio">{profile.bio}</p>
                  <div className="student-preview-skills">
                    {skills.length > 0 ? (
                      <div className="profile-tags" aria-label="Profile skills">
                        {skills.map(skill => <span className="profile-tag" key={skill}>{skill}</span>)}
                      </div>
                    ) : (
                      <p className="student-preview-meta">No skills added yet.</p>
                    )}
                  </div>
                </article>
              ) : (
                <div className="student-preview empty">
                  <div>
                    <div className="preview-empty-mark" aria-hidden="true">SP</div>
                    <p className="preview-empty-copy">Complete the required fields and submit to see the profile card.</p>
                  </div>
                </div>
              )}
            </aside>
          </div>
        </section>
      );
    }

    function CheatCard({ title, code }) {
      return (
        <article className="cheat-card">
          <h3>{title}</h3>
          <pre><code>{code}</code></pre>
        </article>
      );
    }

    function FormsLab() {
      return (
        <main className="page">
          <nav className="topbar" aria-label="Page navigation">
            <a className="brand" href="../index.html"><span className="brand-mark" aria-hidden="true">A</span> Aung Sett Khine</a>
            <div className="nav-links">
              <a href="../index.html">Portfolio</a>
              <a href="../week%2012_2/index.html">Week 12_2 · Effects</a>
            </div>
          </nav>

          <header className="hero">
            <div>
              <p className="eyebrow">Week 13_1 · React forms</p>
              <h1>Build forms that respond.</h1>
              <p className="hero-copy">Practice controlled text, field validation, and checkbox selections with live feedback in React.</p>
            </div>
            <div className="hero-stat" aria-label="4 interactive forms activities">
              <strong>04</strong><span>forms &amp; profile editor</span>
            </div>
          </header>

          <p className="intro-note">Try the three form exercises, then build a student profile with required fields, validation, a photo preview, and optional skill tags. The contact form is a local demo and does not send data.</p>

          <div className="demo-grid">
            <DemoCard
              number="1"
              title="Controlled bio field"
              description="Type up to 200 characters and watch the live count. The field disables at the limit."
              snippet={`const [bio, setBio] = useState("");
const MAX = 200;
<textarea
  value={bio}
  onChange={event => setBio(event.target.value.slice(0, MAX))}
  disabled={bio.length >= MAX}
/>`}
            >
              <BioField />
            </DemoCard>

            <DemoCard
              number="2"
              title="Validated contact form"
              description="Submit all three fields, see field-level errors, then get a thank-you message."
              className="contact-card"
              snippet={`function handleSubmit(event) {
  event.preventDefault();
  const errors = {};
  if (!form.name.trim()) errors.name = "Name is required.";
  if (!form.email.trim()) errors.email = "Email is required.";
  if (!form.message.trim()) errors.message = "Message is required.";
  if (Object.keys(errors).length) {
    setErrors(errors);
    return;
  }
  setSubmittedName(form.name.trim());
  setForm({ name: "", email: "", message: "" });
  setSubmitted(true);
}`}
            >
              <ContactForm />
            </DemoCard>

            <DemoCard
              number="3"
              title="Programming skills"
              description="Select from six skills. More than three selections display a warning."
              snippet={`const [selected, setSelected] = useState([]);
function toggle(skill, checked) {
  setSelected(previous => checked
    ? [...previous, skill]
    : previous.filter(item => item !== skill)
  );
}`}
            >
              <SkillPicker />
            </DemoCard>
          </div>

          <StudentProfileEditor />

          <section className="cheat-sheet" aria-labelledby="cheat-sheet-heading">
            <h2 id="cheat-sheet-heading">React Forms cheat sheet</h2>
            <p>Core controlled-field patterns for common form elements.</p>
            <div className="cheat-grid">
              <CheatCard title="Controlled input" code={`<input
  value={name}
  onChange={event => setName(event.target.value)}
/>`} />
              <CheatCard title="Prevent page reload" code={`<form onSubmit={event => {
  event.preventDefault();
  handleSubmit();
}}>...`} />
              <CheatCard title="Checkbox state" code={`<input
  type="checkbox"
  checked={agreed}
  onChange={event => setAgreed(event.target.checked)}
/>`} />
              <CheatCard title="Multi-field handler" code={`function handleChange(event) {
  const { name, value } = event.target;
  setForm(previous => ({ ...previous, [name]: value }));
}`} />
              <CheatCard title="Validation pattern" code={`const errors = {};
if (!email) errors.email = "Required";
if (Object.keys(errors).length) {
  setErrors(errors);
  return;
}`} />
              <CheatCard title="Select value" code={`<select
  value={city}
  onChange={event => setCity(event.target.value)}
>
  <option value="seoul">Seoul</option>
</select>`} />
              <CheatCard title="Textarea value" code={`<textarea
  value={bio}
  onChange={event => setBio(event.target.value)}
  rows={4}
/>`} />
              <CheatCard title="Field error display" code={`{errors.email && (
  <p role="alert">{errors.email}</p>
)}`} />
            </div>
          </section>

          <footer>Week 13_1 · Controlled inputs, validation, checkboxes, live feedback, and accessible errors.</footer>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("forms-root")).render(<FormsLab />);
  </script>
</body>
</html>
