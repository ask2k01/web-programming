<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Week 6 Task 3 - Trivia Challenge</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #172554;
      background: #eff6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background: linear-gradient(160deg, #dbeafe, #f8fafc 58%);
    }

    main {
      width: min(100%, 680px);
      margin: 0 auto;
    }

    .page-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
    }

    a {
      color: #1d4ed8;
      font-weight: 650;
    }

    .trivia-card {
      margin-top: 24px;
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid #dbeafe;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 18px 50px rgb(30 64 175 / 10%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #2563eb;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 2.8rem);
      letter-spacing: -0.05em;
    }

    .intro {
      margin: 10px 0 26px;
      color: #64748b;
      line-height: 1.6;
    }

    button {
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: #1d4ed8;
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1e40af;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    :focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    #status {
      min-height: 24px;
      margin: 18px 0 0;
      color: #64748b;
    }

    #status.error {
      color: #b91c1c;
    }

    #question-area {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid #e2e8f0;
    }

    #question-area[hidden],
    #next-question[hidden] {
      display: none;
    }

    .question-meta {
      margin: 0 0 8px;
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 650;
    }

    #question-text {
      margin: 0 0 18px;
      font-size: 1.2rem;
      line-height: 1.5;
    }

    #answers {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
      padding: 0;
      border: 0;
    }

    .answer-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
    }

    .answer-option:has(input:checked) {
      border-color: #1d4ed8;
      background: #eff6ff;
    }

    .answer-option input {
      margin-top: 4px;
      accent-color: #1d4ed8;
    }

    #feedback {
      min-height: 24px;
      margin: 14px 0;
      font-weight: 700;
    }

    #feedback.correct {
      color: #15803d;
    }

    #feedback.incorrect {
      color: #b91c1c;
    }

    #question-area.answered .answer-option {
      cursor: default;
    }

    #question-area.answered .answer-option input {
      pointer-events: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      #get-question,
      #check-answer,
      #next-question {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav class="page-links" aria-label="Page navigation">
      <a href="../index.html">← Back to Home</a>
      <a href="task 1.html">Task 1 - Weather Explorer</a>
      <a href="task 2.html">Task 2 - Currency Converter</a>
      <a href="task 4.html">Task 4 - Random Formula 1 Car</a>
      <a href="task 5.html">Task 5 - Hollywood Actor Explorer</a>
      <a href="task 6.html">Task 6 - Random Profile Generator</a>
    </nav>

    <section class="trivia-card" aria-labelledby="page-title">
      <p class="eyebrow">Week 6 · API 3</p>
      <h1 id="page-title">Trivia Challenge</h1>
      <p class="intro">Answer a random multiple-choice question.</p>

      <button id="get-question" type="button">Get a Question</button>
      <p id="status" role="status" aria-live="polite">Ready for a challenge?</p>

      <section id="question-area" aria-labelledby="question-text" hidden>
        <p id="question-meta" class="question-meta"></p>
        <h2 id="question-text"></h2>
        <form id="answer-form">
          <fieldset id="answers">
            <legend class="question-meta">Choose one answer</legend>
          </fieldset>
          <button id="check-answer" type="submit">Check Answer</button>
        </form>
        <p id="feedback" aria-live="polite"></p>
        <button id="next-question" type="button" hidden>Get Another Question</button>
      </section>
    </section>
  </main>

  <script>
    const getQuestionButton = document.getElementById("get-question");
    const answerForm = document.getElementById("answer-form");
    const checkAnswerButton = document.getElementById("check-answer");
    const nextQuestionButton = document.getElementById("next-question");
    const questionArea = document.getElementById("question-area");
    const answersFieldset = document.getElementById("answers");
    const status = document.getElementById("status");
    const feedback = document.getElementById("feedback");
    let correctAnswer = "";

    function decodeHtml(value) {
      const decoder = document.createElement("textarea");
      decoder.innerHTML = value;
      return decoder.value;
    }

    function clearAnswerOptions() {
      answersFieldset.querySelectorAll(".answer-option").forEach((option) => option.remove());
    }

    function renderQuestion(question) {
      const options = [...question.incorrect_answers, question.correct_answer]
        .map(decodeHtml)
        .sort(() => Math.random() - 0.5);

      correctAnswer = decodeHtml(question.correct_answer);
      document.getElementById("question-meta").textContent =
        `${decodeHtml(question.category)} · ${question.difficulty}`;
      document.getElementById("question-text").textContent = decodeHtml(question.question);
      clearAnswerOptions();

      options.forEach((option, index) => {
        const label = document.createElement("label");
        label.className = "answer-option";
        const input = document.createElement("input");
        input.type = "radio";
        input.name = "answer";
        input.value = option;
        input.required = true;
        input.id = `answer-${index}`;
        const text = document.createElement("span");
        text.textContent = option;
        label.htmlFor = input.id;
        label.append(input, text);
        answersFieldset.append(label);
      });

      feedback.textContent = "";
      feedback.className = "";
      questionArea.classList.remove("answered");
      questionArea.hidden = false;
      checkAnswerButton.disabled = false;
      checkAnswerButton.hidden = false;
      nextQuestionButton.hidden = true;
      status.className = "";
      status.textContent = "Choose your answer, then check it.";
    }

    async function getQuestion() {
      getQuestionButton.disabled = true;
      getQuestionButton.textContent = "Loading…";
      nextQuestionButton.disabled = true;
      status.className = "";
      status.textContent = "Loading a question…";
      questionArea.hidden = true;

      try {
        const response = await fetch("https://opentdb.com/api.php?amount=1&type=multiple");
        if (!response.ok) {
          throw new Error(`Question request failed (${response.status}).`);
        }

        const data = await response.json();
        if (data.response_code !== 0 || !Array.isArray(data.results) || !data.results[0]) {
          throw new Error("No question is available right now. Please try again.");
        }

        renderQuestion(data.results[0]);
      } catch (error) {
        console.error("Unable to load a trivia question:", error);
        status.className = "error";
        status.textContent = "Could not load a question. Check your internet connection and try again.";
      } finally {
        getQuestionButton.disabled = false;
        getQuestionButton.textContent = "Get a Question";
        nextQuestionButton.disabled = false;
      }
    }

    getQuestionButton.addEventListener("click", getQuestion);
    nextQuestionButton.addEventListener("click", getQuestion);

    answerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (questionArea.classList.contains("answered")) {
        return;
      }

      const selectedAnswer = answerForm.querySelector('input[name="answer"]:checked');
      if (!selectedAnswer) {
        answerForm.reportValidity();
        return;
      }

      questionArea.classList.add("answered");
      checkAnswerButton.disabled = true;
      nextQuestionButton.hidden = false;

      if (selectedAnswer.value === correctAnswer) {
        feedback.textContent = "Correct! Great job.";
        feedback.className = "correct";
        status.textContent = "Your answer is correct.";
      } else {
        feedback.textContent = `Not quite. The correct answer is: ${correctAnswer}`;
        feedback.className = "incorrect";
        status.textContent = "Answer checked. Try another question!";
      }
    });
  </script>
</body>
</html>
