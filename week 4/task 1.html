<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }

    #clicker {
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background-color: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #clicker.done {
      background-color: #16a34a;
    }
  </style>
</head>
<body>
  <h1>Click Counter</h1>
  <p>Click the button five times.</p>
  <button id="clicker" type="button">Click me: <span id="count">0</span></button>
  <p id="message" aria-live="polite"></p>

  <script>
    const btn = document.querySelector('#clicker');
    const countEl = document.querySelector('#count');
    const msg = document.querySelector('#message');
    let count = 0;

    btn.addEventListener('click', () => {
      count++;
      countEl.textContent = count;
      if (count >= 5) {
        btn.classList.add('done');
        msg.textContent = '🎉 Congratulations! You clicked 5 times!';
      }
    });
  </script>
</body>
</html>
