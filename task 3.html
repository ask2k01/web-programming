<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      color: #222;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
    }

    img {
      display: block;
      width: 400px;
      height: 300px;
      object-fit: cover;
      border: 1px solid #d9d9d9;
      background: #eee;
    }

    p {
      margin-top: 20px;
      font-size: 1.05rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>My Campus Photo</h1>

  <img
    src="https://picsum.photos/400/300"
    alt="University students collaborating on laptops in a bright study room"
    width="400"
    height="300"
  >

  <p>A busy study session at Gachon University.</p>
</body>
</html>
