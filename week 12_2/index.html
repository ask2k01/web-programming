<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17172b">
  <meta name="description" content="Week 12_2 interactive React lessons for effects, dependencies, cleanup, and async data.">
  <title>Week 12_2 | React Effects Lab</title>
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24243a;
      background: #f7f6f2;
      --ink: #24243a;
      --muted: #656679;
      --paper: #fff;
      --canvas: #f7f6f2;
      --line: #e4e2eb;
      --purple: #6e55d9;
      --purple-dark: #4c35b3;
      --purple-soft: #f0edff;
      --lime: #d7f36a;
      --dark: #17172b;
      --orange: #e87b50;
      --green: #18764d;
      --red: #a63c3c;
      --shadow: 0 12px 30px rgb(36 36 58 / 6%);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      color: #f4f2ff;
      background: #141421;
      --ink: #f4f2ff;
      --muted: #c1bfd0;
      --paper: #222238;
      --canvas: #141421;
      --line: #3a3852;
      --purple-soft: #312a50;
      --green: #91e0b7;
      --red: #ff9a9a;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 93% 5%, rgb(215 243 106 / 17%), transparent 25rem),
        var(--canvas);
      color: var(--ink);
      line-height: 1.55;
      transition: background-color 160ms ease, color 160ms ease;
    }

    a, button, input { font: inherit; }
    a { color: var(--purple-dark); }
    :root[data-theme="dark"] a { color: #c0b4ff; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 3px;
    }

    .page {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 22px clamp(16px, 4vw, 48px) 52px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: var(--lime);
      color: #17172b;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
    }

    .nav-links a {
      color: var(--purple-dark);
      font-size: 0.88rem;
      font-weight: 800;
      text-decoration: none;
    }

    :root[data-theme="dark"] .nav-links a { color: #c0b4ff; }
    .nav-links a:hover { text-decoration: underline; text-underline-offset: 4px; }

    .strict-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 750;
      cursor: pointer;
    }

    .strict-toggle input { accent-color: var(--purple-dark); }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 165px;
      align-items: center;
      gap: 24px;
      overflow: hidden;
      margin-bottom: 24px;
      padding: clamp(26px, 5vw, 48px);
      border-radius: 26px;
      background:
        radial-gradient(circle at 88% 12%, rgb(110 85 217 / 42%), transparent 17rem),
        var(--dark);
      color: #fff;
      isolation: isolate;
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      right: -80px;
      bottom: -180px;
      width: 340px;
      height: 340px;
      border: 1px solid rgb(215 243 106 / 28%);
      border-radius: 50%;
      box-shadow: 0 0 0 34px rgb(215 243 106 / 5%), 0 0 0 70px rgb(215 243 106 / 3%);
      content: "";
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--lime);
      font-size: 0.73rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2.35rem, 6vw, 4.6rem);
      letter-spacing: -0.075em;
      line-height: 1.02;
    }

    .hero-copy {
      max-width: 700px;
      margin: 15px 0 0;
      color: #e5e2f0;
    }

    .hero-stat {
      display: grid;
      width: 142px;
      height: 142px;
      place-items: center;
      align-content: center;
      justify-self: center;
      border: 1px solid rgb(255 255 255 / 27%);
      border-radius: 50%;
      background: rgb(255 255 255 / 6%);
      text-align: center;
      transform: rotate(6deg);
    }

    .hero-stat strong { color: var(--lime); font-size: 2.45rem; line-height: 1; }
    .hero-stat span {
      max-width: 95px;
      margin-top: 8px;
      color: #e5e2f0;
      font-size: 0.67rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .how-to {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 18px;
      margin: 0 0 22px;
      padding: 14px 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      color: var(--muted);
      font-size: 0.86rem;
    }

    .how-to strong { color: var(--ink); }

    .lesson-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 16px;
    }

    .lesson-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .lesson-heading {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .lesson-number {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      background: var(--purple-soft);
      color: var(--purple-dark);
      font-size: 0.82rem;
      font-weight: 900;
    }

    h2 {
      margin: 1px 0 0;
      color: var(--ink);
      font-size: 1.08rem;
      letter-spacing: -0.025em;
      line-height: 1.35;
    }

    .lesson-description {
      min-height: 2.7em;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .demo {
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: color-mix(in srgb, var(--purple-soft) 42%, var(--paper));
    }

    .demo p:last-child { margin-bottom: 0; }
    .demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .demo-stack { display: grid; gap: 9px; }
    .button {
      min-height: 38px;
      padding: 7px 12px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: var(--purple-dark);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .button:hover { background: var(--purple); }
    .button.secondary { border-color: var(--line); background: var(--paper); color: var(--ink); }
    .button.secondary:hover { border-color: var(--purple); }
    .button:disabled { cursor: not-allowed; opacity: 0.55; }

    .text-input {
      width: min(100%, 260px);
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
    }

    .text-input[type="number"] { width: 115px; }
    .check-label { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); font-size: 0.84rem; }
    .check-label input { accent-color: var(--purple-dark); }
    .live-output { margin: 10px 0 0; color: var(--ink); font-size: 0.88rem; overflow-wrap: anywhere; }
    .subtle { color: var(--muted); font-size: 0.8rem; }
    .error { color: var(--red); font-weight: 750; }
    .success { color: var(--green); font-weight: 750; }
    .event-list { max-height: 100px; margin: 8px 0 0; padding-left: 20px; overflow: auto; color: var(--muted); font-size: 0.78rem; }
    .profile-result { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 10px; margin-top: 10px; }
    .profile-result img { width: 48px; height: 48px; border-radius: 50%; }
    .profile-result p { margin: 0; overflow-wrap: anywhere; }
    .weather-result { margin-top: 10px; padding: 11px; border-radius: 10px; background: var(--paper); }
    .weather-result strong { color: var(--purple-dark); }
    :root[data-theme="dark"] .weather-result strong { color: #c0b4ff; }

    details.code-details {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    details.code-details summary {
      width: fit-content;
      color: var(--purple-dark);
      font-size: 0.8rem;
      font-weight: 850;
      cursor: pointer;
    }

    :root[data-theme="dark"] details.code-details summary { color: #c0b4ff; }

    pre {
      max-width: 100%;
      margin: 9px 0 0;
      padding: 12px;
      overflow: auto;
      border-radius: 10px;
      background: var(--dark);
      color: #fff;
      font-size: 0.76rem;
      line-height: 1.55;
      tab-size: 2;
      white-space: pre;
    }

    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .source-note { margin: 8px 0 0; color: var(--muted); font-size: 0.76rem; }

    footer {
      margin-top: 25px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 820px) {
      .hero { grid-template-columns: minmax(0, 1fr) 120px; }
      .hero-stat { width: 112px; height: 112px; }
      .hero-stat strong { font-size: 2rem; }
      .lesson-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .page { padding-inline: 14px; }
      .hero { grid-template-columns: 1fr; padding: 25px 21px; border-radius: 20px; }
      .hero-stat { width: 82px; height: 82px; justify-self: start; transform: none; }
      .hero-stat strong { font-size: 1.55rem; }
      .hero-stat span { font-size: 0.55rem; }
      .lesson-card { padding: 16px; }
      .demo { padding: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    function LessonCard({ number, title, description, snippet, children }) {
      return (
        <section className="lesson-card" id={`lesson-${number}`} aria-labelledby={`lesson-title-${number}`}>
          <div className="lesson-heading">
            <span className="lesson-number" aria-hidden="true">{String(number).padStart(2, "0")}</span>
            <h2 id={`lesson-title-${number}`}>{title}</h2>
          </div>
          <p className="lesson-description">{description}</p>
          <div className="demo">{children}</div>
          <details className="code-details">
            <summary>Show React pattern</summary>
            <pre><code>{snippet}</code></pre>
          </details>
        </section>
      );
    }

    function MountProbe({ onLog }) {
      useEffect(() => {
        onLog("Effect setup: component mounted.");
        return () => onLog("Cleanup: component unmounted.");
      }, []);

      return <p className="live-output">Mounted component is on the page.</p>;
    }

    function MountCleanupDemo() {
      const [mounted, setMounted] = useState(false);
      const [events, setEvents] = useState([]);
      const log = message => setEvents(previous => [message, ...previous].slice(0, 4));

      return (
        <div>
          <button className="button" type="button" onClick={() => setMounted(value => !value)}>
            {mounted ? "Unmount" : "Mount"}
          </button>
          {mounted && <MountProbe onLog={log} />}
          <ul className="event-list" aria-live="polite">
            {events.map((event, index) => <li key={`${event}-${index}`}>{event}</li>)}
          </ul>
        </div>
      );
    }

    function DependencyDemo() {
      const [value, setValue] = useState(0);
      const [tick, setTick] = useState(0);

      useEffect(() => {
        console.log("[] ran after mount");
      }, []);
      useEffect(() => {
        console.log("[value] ran; value =", value);
      }, [value]);
      useEffect(() => {
        console.log("(no dependency array) ran after every render");
      });

      return (
        <div>
          <div className="demo-row">
            <button className="button" type="button" onClick={() => setValue(number => number + 1)}>value++</button>
            <button className="button secondary" type="button" onClick={() => setTick(number => number + 1)}>Re-render only</button>
          </div>
          <p className="live-output">value = {value}; extra renders = {tick}</p>
          <p className="subtle">Open the browser console to compare which dependency patterns log.</p>
        </div>
      );
    }

    const demoUsers = {
      1: { name: "Aung Sett Khine", role: "React learner" },
      2: { name: "Maya Chen", role: "Frontend developer" },
      3: { name: "Minho Kim", role: "UI designer" }
    };

    function ProfileFetchDemo() {
      const [userId, setUserId] = useState(1);
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      useEffect(() => {
        setLoading(true);
        setError("");
        setUser(null);
        const timer = setTimeout(() => {
          if (userId === 99) {
            setError("User not found.");
          } else {
            setUser(demoUsers[userId]);
          }
          setLoading(false);
        }, 350);
        return () => clearTimeout(timer);
      }, [userId]);

      return (
        <div>
          <div className="demo-row">
            {[1, 2, 3, 99].map(id => (
              <button className="button secondary" key={id} type="button" onClick={() => setUserId(id)}>
                User {id}
              </button>
            ))}
          </div>
          <p className="live-output" aria-live="polite">
            {loading ? "Loading profile…" : error ? <span className="error">{error}</span> : `${user.name} · ${user.role}`}
          </p>
          <p className="source-note">Uses a small simulated request so loading, success, and error states work offline.</p>
        </div>
      );
    }

    function AsyncEffectDemo() {
      const [attempt, setAttempt] = useState(0);
      const [simulateError, setSimulateError] = useState(false);
      const [message, setMessage] = useState("Waiting to load…");

      useEffect(() => {
        let cancelled = false;
        let timerId;
        async function loadSample() {
          setMessage("Loading sample data…");
          try {
            const result = await new Promise(resolve => {
              timerId = setTimeout(() => resolve({ handle: "react-learner", name: "Simulated user" }), 450);
            });
            if (cancelled) return;
            if (simulateError) throw new Error("Sample request failed.");
            setMessage(`${result.handle}: ${result.name}`);
          } catch (error) {
            if (!cancelled) setMessage(`Error: ${error.message}`);
          }
        }
        loadSample();
        return () => {
          cancelled = true;
          clearTimeout(timerId);
        };
      }, [attempt, simulateError]);

      return (
        <div>
          <div className="demo-row">
            <button className="button" type="button" onClick={() => { setSimulateError(false); setAttempt(number => number + 1); }}>Run async effect</button>
            <button className="button secondary" type="button" onClick={() => { setSimulateError(true); setAttempt(number => number + 1); }}>Simulate error</button>
          </div>
          <p className="live-output" role="status" aria-live="polite">{message}</p>
        </div>
      );
    }

    function SafeClock() {
      const [time, setTime] = useState(new Date());
      useEffect(() => {
        const intervalId = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(intervalId);
      }, []);
      return <p className="live-output">Live clock: {time.toLocaleTimeString()}</p>;
    }

    function LeakyClock() {
      const [time, setTime] = useState(new Date());
      useEffect(() => {
        let ticks = 0;
        const intervalId = setInterval(() => {
          ticks += 1;
          console.log(`Unmounted clock tick ${ticks}`);
          setTime(new Date());
          if (ticks >= 5) clearInterval(intervalId);
        }, 1000);
      }, []);
      return <p className="live-output">Temporary clock: {time.toLocaleTimeString()}</p>;
    }

    function ClockCleanupDemo() {
      const [mode, setMode] = useState("none");
      return (
        <div>
          <div className="demo-row">
            <button className="button" type="button" onClick={() => setMode("safe")}>Mount LiveClock</button>
            <button className="button secondary" type="button" onClick={() => setMode("leaky")}>Mount capped example</button>
            <button className="button secondary" type="button" onClick={() => setMode("none")}>Unmount</button>
          </div>
          {mode === "safe" && <SafeClock key="safe" />}
          {mode === "leaky" && <LeakyClock key="leaky" />}
          <p className="subtle">The capped example logs five ticks after unmount; the LiveClock clears its interval immediately.</p>
        </div>
      );
    }

    function GitHubUserCard({ username }) {
      const [user, setUser] = useState(null);
      const [error, setError] = useState("");

      useEffect(() => {
        const controller = new AbortController();
        setError("");
        setUser(null);

        async function fetchUser() {
          try {
            const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`, {
              signal: controller.signal
            });
            if (!response.ok) throw new Error(response.status === 404 ? "User not found." : `Request failed (${response.status}).`);
            setUser(await response.json());
          } catch (requestError) {
            if (requestError.name !== "AbortError") setError(requestError.message);
          }
        }

        fetchUser();
        return () => controller.abort();
      }, [username]);

      if (error) return <p className="live-output error" role="status">{error}</p>;
      if (!user) return <p className="live-output" role="status">Loading @{username}…</p>;
      return (
        <div className="profile-result">
          <img src={user.avatar_url} alt="" width="48" height="48" />
          <p><strong>{user.login}</strong>{user.name ? ` · ${user.name}` : ""}<br /><span className="subtle">{user.public_repos} public repositories</span></p>
        </div>
      );
    }

    function AbortFetchDemo() {
      const [username, setUsername] = useState("octocat");
      return (
        <div>
          <label className="subtle" htmlFor="abort-username">GitHub username</label>
          <input
            className="text-input"
            id="abort-username"
            value={username}
            onChange={event => setUsername(event.target.value.trim())}
          />
          {username ? <GitHubUserCard username={username} /> : <p className="live-output">Enter a username to search.</p>}
          <p className="source-note">Typing starts a new request and aborts the previous one.</p>
        </div>
      );
    }

    function SearchGitHubDemo() {
      const [input, setInput] = useState("");
      const [username, setUsername] = useState("");
      const [requestNumber, setRequestNumber] = useState(0);
      return (
        <div>
          <form className="demo-row" onSubmit={event => { event.preventDefault(); setUsername(input.trim()); setRequestNumber(number => number + 1); }}>
            <label className="subtle" htmlFor="github-search">GitHub username</label>
            <input
              className="text-input"
              id="github-search"
              value={input}
              onChange={event => setInput(event.target.value)}
              placeholder="octocat"
            />
            <button className="button" type="submit" disabled={!input.trim()}>Search</button>
          </form>
          {username && <GitHubUserCard key={`${username}-${requestNumber}`} username={username} />}
          {!username && <p className="subtle">Try “octocat” or a username that does not exist.</p>}
        </div>
      );
    }

    function RaceConditionDemo() {
      const [query, setQuery] = useState("");
      const [result, setResult] = useState("");
      const [safe, setSafe] = useState(false);

      useEffect(() => {
        const name = query.trim();
        if (!name) {
          setResult("");
          return undefined;
        }

        let cancelled = false;
        const delay = Math.max(250, (8 - name.length) * 240);
        const timeoutId = setTimeout(() => {
          if (!cancelled) setResult(name.toUpperCase());
        }, delay);

        if (!safe) return undefined;
        return () => {
          cancelled = true;
          clearTimeout(timeoutId);
        };
      }, [query, safe]);

      return (
        <div>
          <label className="check-label">
            <input type="checkbox" checked={safe} onChange={event => setSafe(event.target.checked)} />
            Abort previous request (safe mode)
          </label>
          <input
            className="text-input"
            value={query}
            onChange={event => setQuery(event.target.value)}
            placeholder="Type quickly: abcdef"
            aria-label="Race condition query"
          />
          <p className="live-output">You typed: <strong>{query || "—"}</strong></p>
          <p className={`live-output ${result && result !== query.trim().toUpperCase() ? "error" : ""}`}>
            Result shown for: <strong>{result || "—"}</strong>
            {result && result !== query.trim().toUpperCase() ? " (stale result)" : ""}
          </p>
          <p className="source-note">Shorter queries take longer in this simulation so responses can arrive out of order.</p>
        </div>
      );
    }

    function ThemeToggleDemo() {
      const [theme, setTheme] = useState(() => localStorage.getItem("week12-2-theme") || "light");

      useEffect(() => {
        localStorage.setItem("week12-2-theme", theme);
        document.documentElement.dataset.theme = theme;
      }, [theme]);

      return (
        <div>
          <button
            className="button"
            type="button"
            onClick={() => setTheme(current => current === "light" ? "dark" : "light")}
          >
            Current: {theme} — click to toggle
          </button>
          <p className="live-output">Reload the page to see the saved theme restored.</p>
        </div>
      );
    }

    function DocumentTitleDemo() {
      const [count, setCount] = useState(0);

      useEffect(() => {
        const previousTitle = document.title;
        document.title = `Inbox (${count}) | Week 12_2`;
        console.log("Document title updated:", document.title);
        return () => { document.title = previousTitle; };
      }, [count]);

      return (
        <div>
          <p className="live-output">Unread messages: <strong>{count}</strong></p>
          <div className="demo-row">
            <button className="button" type="button" onClick={() => setCount(value => value + 1)}>New message</button>
            <button className="button secondary" type="button" onClick={() => setCount(0)}>Mark all read</button>
          </div>
          <p className="subtle">The browser tab title updates when the count changes. Check the console for each update.</p>
        </div>
      );
    }

    function BadLoop() {
      const [count, setCount] = useState(0);
      const runs = useRef(0);

      useEffect(() => {
        runs.current += 1;
        if (runs.current > 8) {
          console.log("Safety stop: the effect would keep looping.");
          return;
        }
        setCount(value => value + 1);
      }, [count]);

      return <p className="live-output">Guarded loop count: {count}; effect runs: {runs.current}</p>;
    }

    function FixedOnce() {
      const [count, setCount] = useState(0);
      useEffect(() => {
        setCount(value => value + 1);
      }, []);
      return <p className="live-output">FixedOnce count: {count}</p>;
    }

    function LoopGuardDemo() {
      const [mode, setMode] = useState("none");
      return (
        <div>
          <div className="demo-row">
            <button className="button" type="button" onClick={() => setMode("bad")}>Run guarded loop</button>
            <button className="button secondary" type="button" onClick={() => setMode("fixed")}>Run fixed once</button>
            <button className="button secondary" type="button" onClick={() => setMode("none")}>Unmount</button>
          </div>
          {mode === "bad" && <BadLoop key="bad" />}
          {mode === "fixed" && <FixedOnce key="fixed" />}
          <p className="source-note">The guarded example stops after eight effect runs so it cannot lock the page.</p>
        </div>
      );
    }

    function WithEffectName({ first, last }) {
      const renders = useRef(0);
      const [fullName, setFullName] = useState("");
      renders.current += 1;
      useEffect(() => {
        setFullName(`${first} ${last}`.trim());
      }, [first, last]);
      return <p className="live-output">With effect: {fullName || "—"} <span className="subtle">(renders: {renders.current})</span></p>;
    }

    function DerivedName({ first, last }) {
      const renders = useRef(0);
      renders.current += 1;
      const fullName = `${first} ${last}`.trim();
      return <p className="live-output">Derived: {fullName || "—"} <span className="subtle">(renders: {renders.current})</span></p>;
    }

    function DerivedStateDemo() {
      const [first, setFirst] = useState("Aung");
      const [last, setLast] = useState("Sett Khine");
      return (
        <div>
          <div className="demo-row">
            <label className="subtle" htmlFor="first-name">First</label>
            <input className="text-input" id="first-name" value={first} onChange={event => setFirst(event.target.value)} />
            <label className="subtle" htmlFor="last-name">Last</label>
            <input className="text-input" id="last-name" value={last} onChange={event => setLast(event.target.value)} />
          </div>
          <WithEffectName first={first} last={last} />
          <DerivedName first={first} last={last} />
          <p className="source-note">Derived values avoid an effect and an extra render when they can be calculated from props or state.</p>
        </div>
      );
    }

    const weatherDescriptions = {
      0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Fog", 48: "Depositing rime fog", 51: "Light drizzle", 53: "Drizzle",
      55: "Dense drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain",
      71: "Light snow", 73: "Snow", 75: "Heavy snow", 80: "Rain showers",
      81: "Rain showers", 82: "Heavy rain showers", 95: "Thunderstorm"
    };

    function WeatherDashboard() {
      const [latitude, setLatitude] = useState("37.46");
      const [longitude, setLongitude] = useState("127.01");
      const [weather, setWeather] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      useEffect(() => {
        const lat = Number(latitude);
        const lon = Number(longitude);
        if (!Number.isFinite(lat) || lat < -90 || lat > 90 || !Number.isFinite(lon) || lon < -180 || lon > 180) {
          setWeather(null);
          setLoading(false);
          setError("Enter a latitude from −90 to 90 and longitude from −180 to 180.");
          return undefined;
        }

        const controller = new AbortController();
        setLoading(true);
        setError("");
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,weather_code`;

        async function fetchWeather() {
          try {
            const response = await fetch(url, { signal: controller.signal });
            if (!response.ok) throw new Error(`Weather request failed (${response.status}).`);
            const data = await response.json();
            if (!data.current) throw new Error("Weather data was not available for these coordinates.");
            setWeather(data.current);
          } catch (requestError) {
            if (requestError.name !== "AbortError") {
              setWeather(null);
              setError(requestError.message);
            }
          } finally {
            if (!controller.signal.aborted) setLoading(false);
          }
        }

        fetchWeather();
        return () => controller.abort();
      }, [latitude, longitude]);

      return (
        <div>
          <div className="demo-row">
            <label className="subtle" htmlFor="weather-lat">Latitude</label>
            <input className="text-input" id="weather-lat" type="number" step="any" value={latitude} onChange={event => setLatitude(event.target.value)} />
            <label className="subtle" htmlFor="weather-lon">Longitude</label>
            <input className="text-input" id="weather-lon" type="number" step="any" value={longitude} onChange={event => setLongitude(event.target.value)} />
          </div>
          <p className="live-output" role="status" aria-live="polite">
            {loading ? "Loading current weather…" : error ? <span className="error">{error}</span> : null}
          </p>
          {!loading && weather && (
            <div className="weather-result">
              <strong>{weatherDescriptions[weather.weather_code] || `Weather code ${weather.weather_code}`}</strong>
              <p>{weather.temperature_2m} °C · wind {weather.wind_speed_10m} km/h</p>
            </div>
          )}
          <p className="source-note">Powered by Open-Meteo. Try latitude 120 to see input validation.</p>
        </div>
      );
    }

    function EffectsWorkshop() {
      return (
        <main className="page">
          <nav className="topbar" aria-label="Page navigation">
            <a className="brand" href="../index.html"><span className="brand-mark" aria-hidden="true">A</span> Aung Sett Khine</a>
            <div className="nav-links">
              <a href="../index.html">Portfolio</a>
              <a href="../week%2012_1/index.html">Week 12_1 shop</a>
            </div>
          </nav>

          <header className="hero">
            <div>
              <p className="eyebrow">Week 12_2 · React effects</p>
              <h1>Connect React to the outside world.</h1>
              <p className="hero-copy">Explore effect timing, dependencies, async requests, cleanup, and the cases where derived values are simpler than another effect.</p>
            </div>
            <div className="hero-stat" aria-label="13 interactive lessons">
              <strong>13</strong><span>interactive lessons</span>
            </div>
          </header>

          <p className="how-to">
            <span><strong>Try it:</strong> use the controls in each lesson, then open “Show React pattern” for a short code example.</span>
            <span>Open the browser console in the dependency demos to see effect logs.</span>
          </p>

          <div className="lesson-grid">
            <LessonCard
              number={1}
              title="Effect setup and cleanup"
              description="An effect runs after render; a returned function runs before cleanup or unmount."
              snippet={`useEffect(() => {
  console.log("mounted");
  return () => console.log("cleaned up");
}, []);`}
            >
              <MountCleanupDemo />
            </LessonCard>

            <LessonCard
              number={2}
              title="The three dependency patterns"
              description="Compare an empty dependency list, a value dependency, and no dependency list."
              snippet={`useEffect(() => console.log("once"), []);
useEffect(() => console.log("when value changes"), [value]);
useEffect(() => console.log("every render"));`}
            >
              <DependencyDemo />
            </LessonCard>

            <LessonCard
              number={3}
              title="Fetching data when an ID changes"
              description="Watch loading, success, error, and cleanup states using a repeatable local demo request."
              snippet={`useEffect(() => {
  setLoading(true);
  const timer = setTimeout(loadProfile, 350);
  return () => clearTimeout(timer);
}, [userId]);`}
            >
              <ProfileFetchDemo />
            </LessonCard>

            <LessonCard
              number={4}
              title="async/await inside an effect"
              description="Keep the effect callback synchronous and define the async function inside it."
              snippet={`useEffect(() => {
  async function load() {
    try {
      const result = await getSample();
      setResult(result);
    } catch (error) {
      setError(error.message);
    }
  }
  load();
}, [refresh]);`}
            >
              <AsyncEffectDemo />
            </LessonCard>

            <LessonCard
              number={5}
              title="Cleanup: timers"
              description="Compare a clock that clears its interval with a capped example that keeps ticking briefly after unmount."
              snippet={`useEffect(() => {
  const id = setInterval(updateClock, 1000);
  return () => clearInterval(id);
}, []);`}
            >
              <ClockCleanupDemo />
            </LessonCard>

            <LessonCard
              number={6}
              title="Cleanup: AbortController"
              description="Abort the previous GitHub request when the username changes."
              snippet={`useEffect(() => {
  const controller = new AbortController();
  fetch(url, { signal: controller.signal });
  return () => controller.abort();
}, [username]);`}
            >
              <AbortFetchDemo />
            </LessonCard>

            <LessonCard
              number={7}
              title="GitHub user lookup"
              description="Submit a username to fetch a profile and handle loading, missing users, and request errors."
              snippet={`useEffect(() => {
  if (!username) return;
  const controller = new AbortController();
  loadUser(username, controller.signal);
  return () => controller.abort();
}, [username]);`}
            >
              <SearchGitHubDemo />
            </LessonCard>

            <LessonCard
              number={8}
              title="Race conditions and the fix"
              description="Simulated requests finish out of order. Turn on safe mode to cancel obsolete work."
              snippet={`useEffect(() => {
  const controller = new AbortController();
  loadResult(query, { signal: controller.signal });
  return () => controller.abort();
}, [query]);`}
            >
              <RaceConditionDemo />
            </LessonCard>

            <LessonCard
              number={9}
              title="localStorage persistence"
              description="Save a preference in an effect and restore it with a lazy state initializer."
              snippet={`const [theme, setTheme] = useState(
  () => localStorage.getItem("theme") || "light"
);
useEffect(() => {
  localStorage.setItem("theme", theme);
}, [theme]);`}
            >
              <ThemeToggleDemo />
            </LessonCard>

            <LessonCard
              number={10}
              title="Sync the document title"
              description="Update the browser tab when a value changes and restore the old title during cleanup."
              snippet={`useEffect(() => {
  document.title = \`Inbox (\${count})\`;
}, [count]);`}
            >
              <DocumentTitleDemo />
            </LessonCard>

            <LessonCard
              number={11}
              title="Gotcha: an effect loop"
              description="A guarded example shows how an effect can repeatedly trigger itself; compare a one-time update."
              snippet={`useEffect(() => {
  if (runs.current > 8) return;
  setCount(value => value + 1);
}, [count]);`}
            >
              <LoopGuardDemo />
            </LessonCard>

            <LessonCard
              number={12}
              title="Sometimes you do not need an effect"
              description="Compare a full name stored through an effect with a value derived during render."
              snippet={`// Prefer deriving when possible:
const fullName = first + " " + last;`}
            >
              <DerivedStateDemo />
            </LessonCard>

            <LessonCard
              number={13}
              title="Homework starter: weather dashboard"
              description="Fetch current weather by coordinates. Try latitude 120 to test validation."
              snippet={`useEffect(() => {
  const controller = new AbortController();
  fetch(weatherUrl, { signal: controller.signal });
  return () => controller.abort();
}, [latitude, longitude]);`}
            >
              <WeatherDashboard />
            </LessonCard>
          </div>

          <footer>Week 12_2 · React effects, dependency arrays, cleanup, async data, and derived state.</footer>
        </main>
      );
    }

    function App() {
      const [strictMode, setStrictMode] = useState(false);
      return (
        <>
          <div className="page" style={{ paddingBottom: 0 }}>
            <label className="strict-toggle">
              <input type="checkbox" checked={strictMode} onChange={event => setStrictMode(event.target.checked)} />
              Strict Mode
            </label>
          </div>
          {strictMode
            ? <React.StrictMode><EffectsWorkshop /></React.StrictMode>
            : <EffectsWorkshop />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);
  </script>
</body>
