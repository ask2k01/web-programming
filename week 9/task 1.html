<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 9 Task 1 - Accessible Buttons</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #1f2937;
      background: #f3f6fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid #c8d4f0;
      border-radius: 12px;
      background: #fff;
    }

    .week-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .week-nav a {
      color: #1a56db;
      font-weight: 600;
    }

    h1 {
      margin-top: 0;
      color: #1a2540;
    }

    p {
      line-height: 1.6;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #1a56db;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1447b3;
    }

    .btn:focus-visible {
      outline: 3px solid #1a7f5a;
      outline-offset: 3px;
    }

    button:focus-visible {
      outline: 3px solid #dc2626;
      outline-offset: 3px;
    }

    .close-button {
      width: 44px;
      padding: 10px;
      background: #4b5563;
      font-size: 20px;
      line-height: 1;
    }

    .close-button:hover {
      background: #374151;
    }

    #message {
      min-height: 1.6em;
      color: #1a2540;
    }
  </style>
</head>
<body>
  <main>
    <nav class="week-nav" aria-label="Week 9 tasks">
      <a href="../index.html">Home</a>
      <a href="task 1.html" aria-current="page">Task 1: Accessible Buttons</a>
      <a href="task 2.html">Task 2: Accessible Images</a>
      <a href="task 3.html">Task 3: Accessible Controls</a>
    </nav>
    <h1>Accessible Buttons</h1>
    <p>
      Use real buttons for actions so they work with a mouse, keyboard, and assistive
      technology. Press Tab to move between the buttons and see their focus outlines.
    </p>

    <div class="button-row">
      <button class="btn" id="submit-button" type="button">Submit form</button>
      <button class="close-button" id="close-button" type="button" aria-label="Close">✕</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const message = document.getElementById("message");

    document.getElementById("submit-button").addEventListener("click", () => {
      message.textContent = "Submit button clicked.";
    });

    document.getElementById("close-button").addEventListener("click", () => {
      message.textContent = "Close button clicked.";
    });
  </script>
</body>
</html>
